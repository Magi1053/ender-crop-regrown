plugins {
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(":common").loom.accessWidenerPath
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

repositories {
    maven { url "https://maven.k-4u.nl/" }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

//    modImplementation("fuzs.forgeconfigscreens:forgeconfigscreens-forge:8.0.2")

    modImplementation("maven.modrinth:jade:yd8FKCmx")
    modImplementation("mcjty.theoneprobe:theoneprobe:1.21_neo-12.0.8-7") { transitive false }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand rootProject.properties
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "architectury.common.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set("dev-shadow")
}

remapJar {
    atAccessWideners.add(loom.accessWidenerPath.get().asFile.name)
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    from(rootProject.file("./LICENSE"))
    archiveClassifier.set("neoforge")
}

jar {
    archiveClassifier.set("dev")
}

// Development uses the access widener directly; production NeoForge needs its AT.
// Check the remapped artifact so a dev-only access change cannot ship again.
def verifyWaterAccessTransformer = tasks.register('verifyWaterAccessTransformer') {
    dependsOn remapJar
    inputs.file(remapJar.archiveFile)
    doLast {
        def artifact = remapJar.archiveFile.get().asFile
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            def entry = zip.getEntry('META-INF/accesstransformer.cfg')
            if (entry == null) {
                throw new GradleException("Missing access transformer in ${artifact.name}")
            }
            def transformer = zip.getInputStream(entry).withCloseable { it.getText('UTF-8') }
            def waterAccess = 'public net.minecraft.world.level.block.FarmBlock isNearWater(Lnet/minecraft/world/level/LevelReader;Lnet/minecraft/core/BlockPos;)Z'
            if (!transformer.readLines().any { it.trim() == waterAccess }) {
                throw new GradleException("Missing FarmBlock.isNearWater access in ${artifact.name}")
            }
        }
    }
}

check.dependsOn verifyWaterAccessTransformer

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
